<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A" />
      <stop offset="50%" stop-color="#16365C" />
      <stop offset="100%" stop-color="#0A1D33" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Graphic: Shield & Analytics & Cap -->
  <g transform="translate(256, 210)" text-anchor="middle" filter="url(#shadow)">
    <!-- Graduation Cap Top -->
    <path d="M-90,-60 L0,-100 L90,-60 L0,-20 Z" fill="#38BDF8" />
    <path d="M0,-20 L0,20" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="24" r="6" fill="#10B981" />
    <path d="M70,-50 L70,-10 C70,15 40,25 0,25 C-40,25 -70,15 -70,-10 L-70,-50" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Analytics Chart Bars -->
    <rect x="-60" y="35" width="22" height="45" rx="4" fill="#38BDF8" />
    <rect x="-25" y="15" width="22" height="65" rx="4" fill="#10B981" />
    <rect x="10" y="-5" width="22" height="85" rx="4" fill="#34D399" />
    <rect x="45" y="-25" width="22" height="105" rx="4" fill="#60A5FA" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    SPSS <tspan fill="#10B981">SBA</tspan>
  </text>

  <!-- Subtitle -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    خدمات أكاديمية وإحصائية
  </text>
</svg>
